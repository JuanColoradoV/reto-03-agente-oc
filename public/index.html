<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Agente OC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#input">Ir al mensaje</a>
  <header class="app-head">
    <div class="brand">
      <h1>Agente OC</h1>
      <p class="sub">Órdenes de compra · SAP simulado</p>
    </div>
    <div class="head-actions">
      <time id="folio" class="folio" aria-label="Fecha"></time>
      <span id="mode-badge" class="stamp amber" role="status" hidden>Modo simulado</span>
      <span id="health-badge" class="stamp health" role="status" data-state="pending"><span class="dotmark" aria-hidden="true"></span><span id="health-text">Conectando…</span></span>
      <button id="drawer-toggle" class="btn btn-quiet drawer-toggle" type="button" aria-expanded="false" aria-controls="side">Expediente</button>
      <button id="reset" class="btn btn-quiet" type="button">Nueva conversación</button>
    </div>
  </header>

  <div id="banner" class="banner" role="alert" hidden></div>

  <div class="shell">
    <section class="chat" aria-label="Conversación">
      <div id="scroller" class="scroller" tabindex="-1">
        <div id="log" class="log" aria-live="polite"></div>
        <div id="loading" class="loading" role="status"><span id="loading-text">Preparando el agente…</span></div>
      </div>
      <form id="composer" class="composer">
        <label class="sr-only" for="input">Mensaje para el agente</label>
        <textarea id="input" rows="1" placeholder="Escribe tu mensaje…  (Enter envía, Shift+Enter agrega una línea)" maxlength="4000"></textarea>
        <button id="send" class="btn btn-primary" type="submit">Enviar</button>
      </form>
      <p id="composer-hint" class="composer-hint" role="status" hidden></p>
    </section>

    <aside id="side" class="side" aria-label="Expediente: solicitudes y traza">
      <div class="side-head">
        <h2>Expediente</h2>
        <button id="drawer-close" class="btn btn-quiet drawer-close" type="button" aria-label="Cerrar panel">Cerrar</button>
      </div>
      <ul id="quick" class="req-list"></ul>

      <section class="side-section" aria-labelledby="trace-title">
        <h2 id="trace-title" class="side-title">Traza y costo</h2>
        <div id="trace" class="trace"><p class="muted small">Aún sin actividad.</p></div>
      </section>
    </aside>
  </div>
  <div id="scrim" class="scrim" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
